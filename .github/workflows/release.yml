name: Release

# AERA-Gateway as a GitHub Release, vX.Y from VERSION in gateway/aera-gateway:
# Actions > Release > Run workflow, on main, with the notes. It runs CI's
# tests (the unit tests and tests/systemd.sh) and then tags main's commit.
# The Docker image comes with it (Erez, 9 Nov 2026): ghcr.io/whomper/aera-gateway
# :X.Y and :latest, :X.Y-browser and :latest-browser, for linux/arm64 and
# linux/amd64, each built on a machine of its own kind (docs/DOCKER.md).
# A release that doesn't work is never deleted or reused: revert on main,
# bump VERSION, release the next number, and say in the bad one's notes
# that it is withdrawn and which one to use.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What is new (Markdown): the release's notes"
        required: true
        type: string

permissions:
  contents: read

jobs:
  which:
    name: Which release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          if [ "$GITHUB_REF_NAME" != main ]; then
            echo "::error::run it on main"
            exit 1
          fi
          V=$(sed -n 's/^VERSION = "\([0-9]*\.[0-9]*\)".*/\1/p' gateway/aera-gateway)
          if [ -z "$V" ]; then
            echo "::error::gateway/aera-gateway has no VERSION = \"X.Y\""
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "::error::v$V is out already: raise VERSION in gateway/aera-gateway and commit first"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

  tests:
    needs: which
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish
    needs: [which, tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          V: ${{ needs.which.outputs.version }}
        run: |
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          gh release create "v$V" --target "$GITHUB_SHA" --title "AERA-Gateway $V" \
            --notes-file "$RUNNER_TEMP/notes.md"

  image:
    name: Docker image (${{ matrix.arch }}${{ matrix.browser == '1' && ', browser' || '' }})
    needs: [which, release]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04, browser: "0"}
          - {arch: arm64, runner: ubuntu-24.04-arm, browser: "0"}
          - {arch: amd64, runner: ubuntu-24.04, browser: "1"}
          - {arch: arm64, runner: ubuntu-24.04-arm, browser: "1"}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: BROWSER=${{ matrix.browser }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.which.outputs.version }}
            org.opencontainers.image.licenses=GPL-2.0-or-later
          outputs: type=image,name=ghcr.io/whomper/aera-gateway,push-by-digest=true,name-canonical=true,push=true
      - run: echo "${{ steps.build.outputs.digest }}" > "digest-${{ matrix.arch }}-${{ matrix.browser }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}-${{ matrix.browser }}
          path: digest-${{ matrix.arch }}-${{ matrix.browser }}

  tags:
    name: Docker tags
    needs: [which, image]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - env:
          V: ${{ needs.which.outputs.version }}
        run: |
          I=ghcr.io/whomper/aera-gateway
          docker buildx imagetools create -t "$I:$V" -t "$I:latest" \
            "$I@$(cat digest-amd64-0)" "$I@$(cat digest-arm64-0)"
          docker buildx imagetools create -t "$I:$V-browser" -t "$I:latest-browser" \
            "$I@$(cat digest-amd64-1)" "$I@$(cat digest-arm64-1)"
