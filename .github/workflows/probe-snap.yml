name: Probe snap Chromium
on:
  push:
    branches: [probe-snap]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          sudo snap install chromium
          sudo rm -f /usr/bin/chromium /usr/bin/chromium-browser     # the runner's own build: not Ubuntu's
          sudo apt-get install -y -qq xvfb xdotool python3-pil gcc make >/dev/null
          sudo gateway/aera-gateway install web --allow-local
          sudo sed -i 's|^ExecStart=\(.*\)$|ExecStart=\1 --browser|' /etc/systemd/system/webgate.service
          grep ExecStart /etc/systemd/system/webgate.service
          sudo systemctl daemon-reload && sudo systemctl restart webgate
          sudo systemd-run --unit=probe-x -p User=nobody /usr/bin/Xvfb :99 -screen 0 1280x3072x24 -nolisten tcp
          sleep 2
      - name: "E: webgate's home in /var/lib (snapd homedirs), lingering, Chromium as a user service"
        if: always()
        run: |
          sudo systemctl stop webgate
          sudo usermod -d /var/lib/webgate webgate
          sudo systemctl start webgate
          sudo snap set system homedirs=/var/lib && sudo snap get system homedirs
          sudo install -d -o webgate -g webgate /var/lib/webgate
          sudo loginctl enable-linger webgate
          sleep 3
          U=$(id -u webgate); ls -ld /run/user/$U || true
          systemctl is-active user@$U.service || true
          C=/var/lib/webgate/snap/chromium/common
          sudo -u webgate mkdir -p $C && sudo cp -r /opt/aera-gateway/webgate-ext $C/ && sudo chown -R webgate: $C
          sudo -u webgate env XDG_RUNTIME_DIR=/run/user/$U systemd-run --user --unit=probe-e \
            -p Environment=DISPLAY=:99 /snap/bin/chromium --kiosk --no-first-run \
            --user-data-dir=$C/profile --load-extension=$C/webgate-ext \
            --proxy-server=http://127.0.0.1:8281 "--proxy-bypass-list=<-loopback>;127.0.0.1:8281" \
            "--host-resolver-rules=MAP * ~NOTFOUND, EXCLUDE 127.0.0.1" --disable-quic about:blank
          sleep 25
          sudo -u webgate env XDG_RUNTIME_DIR=/run/user/$U systemctl --user is-active probe-e || true
          sudo journalctl _UID=$U --no-pager -n 30 | cut -c1-220
          curl -s -m 60 -x http://127.0.0.1:8280 -H 'X-Gateway-Snapshot: 1' -D - http://example.com/ | head -c 600; echo
          sudo -u webgate env XDG_RUNTIME_DIR=/run/user/$U systemctl --user stop probe-e || true
      - name: "F: an ordinary user with a /home, lingering, Chromium as a user service"
        if: always()
        run: |
          sudo useradd -m -s /usr/sbin/nologin wgsnap
          sudo loginctl enable-linger wgsnap
          sleep 3
          U=$(id -u wgsnap)
          C=/home/wgsnap/snap/chromium/common
          sudo -u wgsnap mkdir -p $C && sudo cp -r /opt/aera-gateway/webgate-ext $C/ && sudo chown -R wgsnap: $C
          sudo -u wgsnap env XDG_RUNTIME_DIR=/run/user/$U systemd-run --user --unit=probe-f \
            -p Environment=DISPLAY=:99 /snap/bin/chromium --kiosk --no-first-run \
            --user-data-dir=$C/profile --load-extension=$C/webgate-ext \
            --proxy-server=http://127.0.0.1:8281 "--proxy-bypass-list=<-loopback>;127.0.0.1:8281" about:blank
          sleep 25
          sudo -u wgsnap env XDG_RUNTIME_DIR=/run/user/$U systemctl --user is-active probe-f || true
          sudo journalctl _UID=$U --no-pager -n 20 | cut -c1-220
          curl -s -m 60 -x http://127.0.0.1:8280 -H 'X-Gateway-Snapshot: 1' -D - http://example.com/ | head -c 600; echo
