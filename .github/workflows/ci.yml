name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:          # the Release workflow's tests

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.9: Raspberry Pi OS bullseye; 3.11: bookworm; 3.12: Ubuntu 24.04; 3.13: trixie
        python: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: What the tests need (eftpgate's SFTP and FTPS servers)
        run: pip install paramiko pyftpdlib pyopenssl pyflakes
      - name: Pillow for webgate's pictures (bullseye's 8.1.2 with Python 3.9)
        run: |
          if [ "${{ matrix.python }}" = "3.9" ]; then pip install pillow==8.1.2; else pip install pillow; fi
      - name: pyflakes
        run: python -m pyflakes gateway/*.py gateway/aera-gateway
      - name: The gateways, aeragate and the installer
        run: python -m unittest discover -s gateway -p 'test_*.py' -v

  systemd:
    name: On a computer with systemd
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Take over the apps' set-ups, install, remove; the claude recipe
        run: sudo tests/systemd.sh
